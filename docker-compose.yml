services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fireside_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fireside-chat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fireside_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fireside-chat-postgres:
