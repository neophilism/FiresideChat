name: Wake FiresideChat archive worker

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Keep publisher-transcript recovery progressing on the free preview service
        run: |
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 10 --max-time 110 \
            'https://fireside-chat-preview.onrender.com/api/health/live'
