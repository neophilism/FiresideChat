name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fireside_chat
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fireside_chat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fireside_chat?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate registry
        run: npm run registry:validate

      - name: One-time live probe of recovered podcast feeds
        run: |
          set -euo pipefail
          feeds=(
            "https://anchor.fm/s/106cc7b4c/podcast/rss"
            "https://api.riverside.fm/hosting/r1lIhYeW.rss"
            "https://www.king.senate.gov/podcast/feed?new"
            "https://feeds.simplecast.com/csy2Vjm1"
            "https://feeds.soundcloud.com/users/soundcloud:users:225913226/sounds.rss"
            "https://feeds.soundcloud.com/users/soundcloud:users:657762987/sounds.rss"
            "https://anchor.fm/s/101b1e1d8/podcast/rss"
            "https://anchor.fm/s/103c70cdc/podcast/rss"
            "https://media.rss.com/the-pod-couple-episode-1/feed.xml"
            "https://rss.buzzsprout.com/2311905.rss"
          )
          tmp_feed="$(mktemp)"
          trap 'rm -f "$tmp_feed"' EXIT
          for feed in "${feeds[@]}"; do
            echo "Probing $feed"
            curl --fail --location --silent --show-error --max-time 25 "$feed" -o "$tmp_feed"
            grep -Eq '<rss|<feed' "$tmp_feed"
          done

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Wait for database
        run: npm run db:wait

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Seed verified registry
        run: npm run db:seed

      - name: Test feed ingestion
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Crawl rendered MVP
        run: |
          npm run start > /tmp/fireside-chat.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run smoke:mvp
